# ===== IndovinaLaParola - Configurazione Server =====
# Tutti i percorsi sono RELATIVI alla working directory (cartella run/)

# Porta di ascolto del server TCP
server.port=5000

# Percorso database SQLite (creato automaticamente al primo avvio)
db.path=db/database.db

# Percorso default per il salvataggio dell'analisi serializzata
analysis.save.path=data/analysis.dat

# Durata massima di ogni sfida in secondi
game.timeout.seconds=60

# Numero di parole dell'estratto inviato ai client
game.excerpt.words=60
