# ===== GuessTheWord Server Configuration =====

# Porta di ascolto del server
server.port=5000

# Percorso database SQLite (relativo alla directory di esecuzione)
db.path=db/database.db

# Percorso default per il salvataggio dell'analisi serializzata
analysis.save.path=data/analysis.dat

# Timeout sfida in secondi
game.timeout.seconds=60

# Numero di parole dell'estratto da inviare ai client
game.excerpt.words=60
